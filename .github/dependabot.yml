version: 2

updates:
  # Workflows pin actions to commit SHAs; Dependabot bumps the SHA and the
  # version comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Skip releases younger than a week, so a compromised release has time to
    # be caught and pulled before it reaches CI.
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
      include: scope

  - package-ecosystem: gradle
    directory: /backend
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # Minor and patch updates land as one PR; majors (e.g. Spring Boot 5)
    # stay separate so each gets its own review.
    groups:
      gradle-minor-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: chore
      include: scope
